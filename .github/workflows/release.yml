name: Publish NPM Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          registry-url: "https://registry.npmjs.org/"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Determine release type
        id: determine-release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_ENV"
            if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
              echo "release=minor" >> "$GITHUB_ENV"
            elif [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "release=patch" >> "$GITHUB_ENV"
            else
              echo "release=none" >> "$GITHUB_ENV"
            fi
          else
            echo "release=none" >> "$GITHUB_ENV"
          fi

      - name: Read package metadata
        id: package
        if: env.release != 'none'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NPM_TAG=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          echo "name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "npm_tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"

      - name: Check npm version
        id: npm-version
        if: env.release != 'none'
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.npm-version.outputs.should_publish == 'true'
        run: npm test

      - name: Typecheck
        if: steps.npm-version.outputs.should_publish == 'true'
        run: npm run typecheck

      - name: Build dist from source
        if: steps.npm-version.outputs.should_publish == 'true'
        run: npm run build:publish

      - name: Verify npm package contents
        if: steps.npm-version.outputs.should_publish == 'true'
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.npm-version.outputs.should_publish == 'true'
        run: npm publish --tag "${{ steps.package.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
